name: Tallwood

on:
  push:
    paths: ['tallwood/**', '.github/workflows/tallwood.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            bin: tallwood
          - os: windows-latest
            name: windows
            bin: tallwood.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tallwood
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - run: cargo test --no-default-features
      - run: cargo build --release --features custom-protocol
      - uses: actions/upload-artifact@v4
        with:
          name: tallwood-${{ matrix.name }}
          path: tallwood/target/release/${{ matrix.bin }}
